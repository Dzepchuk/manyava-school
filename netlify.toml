[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[dev]
  command = "npm run dev"
  targetPort = 4321

[context.production]
  command = "PUBLIC_SITE_URL=https://manyava-school.if.ua npm run build"

[context.deploy-preview]
  command = "PUBLIC_SITE_URL=$DEPLOY_PRIME_URL npm run build"

[context.branch-deploy]
  command = "PUBLIC_SITE_URL=$DEPLOY_PRIME_URL npm run build"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; connect-src 'self' https://api.github.com https://api.netlify.com https://unpkg.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com https://api.netlify.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
