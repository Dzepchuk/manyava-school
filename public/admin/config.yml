locale: uk

backend:
  name: github
  repo: Dzepchuk/manyava-school
  branch: main
  preview_context: deploy/netlify
  squash_merges: true
  use_graphql: true

publish_mode: editorial_workflow
media_folder: public/media/uploads
public_folder: /media/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: site-settings
    label: Налаштування сайту
    delete: false
    editor:
      preview: false
    files:
      - name: official-contacts
        label: Офіційні контакти
        file: src/data/site.yml
        fields:
          - { label: Повна назва, name: officialName, widget: string }
          - { label: Коротка назва, name: shortName, widget: string }
          - { label: Англомовна назва, name: englishName, widget: string }
          - { label: Код ЄДРПОУ, name: registrationCode, widget: string }
          - { label: Тип закладу, name: institutionType, widget: string }
          - { label: Форма власності, name: ownership, widget: string }
          - { label: Засновник, name: founder, widget: string }
          - { label: Уповноважений орган управління, name: governingBody, widget: string }
          - { label: Гасло, name: tagline, widget: string }
          - { label: Поштова адреса, name: address, widget: string }
          - label: Телефони
            name: phones
            widget: list
            min: 1
            fields:
              - { label: Підпис, name: label, widget: string }
              - { label: Номер, name: value, widget: string }
          - {
              label: Email,
              name: email,
              widget: string,
              pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', Вкажіть коректний email],
            }
          - { label: Години роботи, name: workingHours, widget: string }
          - label: Публікація контактів
            name: contactPublication
            widget: object
            fields:
              - { label: Показувати адресу, name: address, widget: boolean }
              - { label: Показувати телефони, name: phones, widget: boolean }
              - { label: Показувати email, name: email, widget: boolean }
              - { label: Показувати години роботи, name: workingHours, widget: boolean }
          - { label: Адреса сайту, name: siteUrl, widget: string }
          - {
              label: Соціальні мережі,
              name: socialLinks,
              widget: list,
              required: false,
              default: [],
            }
          - label: SEO за замовчуванням
            name: defaultSeo
            widget: object
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Опис, name: description, widget: text }
          - { label: Аналітика увімкнена, name: analyticsEnabled, widget: boolean, default: false }
          - { label: Оновлено, name: updatedAt, widget: datetime, time_format: false }
          - { label: Затвердив, name: approvedBy, widget: string, default: director }

  - name: pages
    label: Сторінки
    label_singular: Сторінка
    description: Стабільні інформаційні сторінки ліцею.
    folder: src/content/pages
    create: false
    delete: false
    extension: md
    format: frontmatter
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Короткий опис, name: description, widget: text }
      - { label: Шлях, name: path, widget: string, hint: 'Формат: /about/' }
      - label: Розділ
        name: section
        widget: select
        options:
          - { label: Про ліцей, value: about }
          - { label: Батькам, value: parents }
          - { label: Учням, value: students }
          - { label: Безпека, value: safety }
          - { label: Прозорість, value: transparency }
      - { label: Показувати в навігації, name: showInNavigation, widget: boolean }
      - label: SEO-зображення
        name: seoImage
        widget: object
        required: false
        fields:
          - { label: Файл, name: src, widget: image }
          - { label: Альтернативний текст, name: alt, widget: string }
          - { label: Ширина у пікселях, name: width, widget: number, value_type: int, min: 1 }
          - { label: Висота у пікселях, name: height, widget: number, value_type: int, min: 1 }
          - { label: URL джерела, name: sourceUrl, widget: string, required: false }
          - { label: Ліцензія або дозвіл, name: license, widget: string }
          - { label: Хто затвердив, name: approvedBy, widget: string, default: director }
          - { label: Дата затвердження, name: approvedAt, widget: datetime, time_format: false }
          - { label: Є діти на зображенні, name: containsChildren, widget: boolean, default: false }
          - {
              label: Підстава публікації дітей,
              name: publicationBasis,
              widget: string,
              required: false,
            }
          - {
              label: Зображення показує реальний ліцей,
              name: depictsSchoolReality,
              widget: boolean,
              default: true,
            }
      - { label: Пошукові слова, name: searchKeywords, widget: list, required: false }
      - &review
        label: Перевірка й відповідальність
        name: review
        widget: object
        fields:
          - { label: Відповідальний, name: ownerId, widget: string, default: director }
          - { label: Створено, name: createdAt, widget: datetime, time_format: false }
          - { label: Оновлено, name: updatedAt, widget: datetime, time_format: false }
          - { label: Перевірено, name: reviewedAt, widget: datetime, time_format: false }
          - { label: Наступна перевірка, name: reviewDueAt, widget: datetime, time_format: false }
          - label: Статус
            name: status
            widget: select
            default: published
            options:
              - { label: Опубліковано, value: published }
              - { label: В архіві, value: archived }
      - &safe_body
        label: Зміст
        name: body
        widget: markdown
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
        editor_components: []

  - name: news
    label: Новини
    label_singular: Новина
    folder: src/content/news
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    preview_path: news/{{slug}}
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Короткий опис, name: description, widget: text }
      - { label: Дата публікації, name: publishedAt, widget: datetime }
      - {
          label: Дата події,
          name: eventDate,
          widget: datetime,
          required: false,
          time_format: false,
        }
      - &media
        label: Головне зображення
        name: cover
        widget: object
        required: false
        fields: &media_fields
          - { label: Файл, name: src, widget: image }
          - {
              label: Альтернативний текст,
              name: alt,
              widget: string,
              hint: Коротко опишіть зміст зображення.,
            }
          - { label: Ширина у пікселях, name: width, widget: number, value_type: int, min: 1 }
          - { label: Висота у пікселях, name: height, widget: number, value_type: int, min: 1 }
          - {
              label: URL джерела,
              name: sourceUrl,
              widget: string,
              required: false,
              hint: Обов’язково для зовнішнього зображення; лише HTTPS.,
            }
          - { label: Ліцензія або дозвіл, name: license, widget: string }
          - { label: Хто затвердив, name: approvedBy, widget: string, default: director }
          - { label: Дата затвердження, name: approvedAt, widget: datetime, time_format: false }
          - { label: Є діти на зображенні, name: containsChildren, widget: boolean, default: false }
          - {
              label: Підстава публікації дітей,
              name: publicationBasis,
              widget: string,
              required: false,
            }
          - {
              label: Зображення показує реальний ліцей,
              name: depictsSchoolReality,
              widget: boolean,
              default: true,
            }
      - label: Галерея
        name: gallery
        widget: list
        required: false
        default: []
        fields: *media_fields
      - { label: Автор, name: authorDisplayName, widget: string, default: Манявський ліцей }
      - { label: Теги, name: tags, widget: list, required: false, default: [] }
      - { label: Важлива новина, name: featured, widget: boolean, default: false }
      - *review
      - *safe_body

  - name: notices
    label: Оголошення
    label_singular: Оголошення
    folder: src/content/notices
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Короткий опис, name: description, widget: text }
      - { label: Початок, name: startsAt, widget: datetime }
      - { label: Завершення, name: expiresAt, widget: datetime }
      - label: Аудиторія
        name: audience
        widget: select
        options:
          - { label: Усі, value: all }
          - { label: Батьки, value: parents }
          - { label: Учні, value: students }
          - { label: Працівники, value: staff }
          - { label: Громада, value: community }
      - label: Пріоритет
        name: priority
        widget: select
        default: normal
        options:
          - { label: Звичайне, value: normal }
          - { label: Важливе, value: important }
          - { label: Термінове, value: urgent }
      - *review
      - *safe_body

  - name: events
    label: Події
    label_singular: Подія
    folder: src/content/events
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    preview_path: events/{{slug}}
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Короткий опис, name: description, widget: text }
      - { label: Початок, name: startsAt, widget: datetime }
      - { label: Завершення, name: endsAt, widget: datetime, required: false }
      - label: Статус часу
        name: timeStatus
        widget: select
        options:
          - { label: Підтверджено, value: confirmed }
          - { label: Буде уточнено, value: to-be-confirmed }
      - { label: Місце, name: location, widget: string, required: false }
      - label: Формат
        name: format
        widget: select
        options:
          - { label: Очно, value: onsite }
          - { label: Онлайн, value: online }
          - { label: Змішано, value: hybrid }
      - {
          label: Зовнішнє посилання,
          name: externalUrl,
          widget: string,
          required: false,
          hint: Лише HTTPS.,
        }
      - *review
      - *safe_body

  - name: documents
    label: Документи
    label_singular: Документ
    folder: src/content/documents
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    preview_path: documents/{{slug}}
    fields:
      - { label: Назва, name: title, widget: string }
      - { label: Короткий опис, name: description, widget: text }
      - { label: Дата документа, name: documentDate, widget: datetime, time_format: false }
      - { label: Дата публікації, name: publishedAt, widget: datetime, time_format: false }
      - label: Категорія
        name: categoryId
        widget: select
        options:
          - { label: Організаційні документи, value: organizational-documents }
          - { label: Освітня діяльність, value: educational-activity }
          - { label: Фінансова прозорість, value: financial-transparency }
          - { label: Безпека, value: safety }
      - {
          label: ID нормативної підстави,
          name: legalPublicationId,
          widget: string,
          required: false,
        }
      - {
          label: Обов’язкове оприлюднення,
          name: mandatoryPublication,
          widget: boolean,
          default: false,
        }
      - label: Статус нормативної підстави
        name: legalPublicationStatus
        widget: select
        required: false
        options:
          - { label: Не перевірено, value: unverified }
          - { label: Підтверджено, value: confirmed }
          - { label: Замінено, value: superseded }
      - { label: Номер, name: number, widget: string, required: false }
      - { label: Видавець, name: issuer, widget: string, required: false }
      - label: Файл
        name: file
        widget: object
        fields:
          - { label: Файл документа, name: path, widget: file, required: false }
          - label: Тип файла
            name: mimeType
            widget: select
            options:
              - { label: PDF, value: application/pdf }
              - { label: ODT, value: application/vnd.oasis.opendocument.text }
              - {
                  label: DOCX,
                  value: application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                }
              - {
                  label: XLSX,
                  value: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
                }
              - { label: CSV, value: text/csv }
          - { label: Розмір у байтах, name: bytes, widget: number, value_type: int, min: 1 }
          - { label: Файл доступний, name: available, widget: boolean, default: true }
      - { label: Доступний опис, name: accessibleSummary, widget: text }
      - { label: ID серії, name: seriesId, widget: string, required: false }
      - { label: Замінює документ, name: supersedes, widget: string, required: false }
      - label: Статус версії
        name: versionStatus
        widget: select
        default: current
        options:
          - { label: Чинна, value: current }
          - { label: Замінена, value: superseded }
          - { label: Відкликана, value: withdrawn }
      - { label: Пошукові слова, name: searchKeywords, widget: list, required: false, default: [] }
      - *review
      - *safe_body

  - name: document-reference-data
    label: Довідники документів
    delete: false
    editor:
      preview: false
    files:
      - name: document-categories
        label: Категорії документів
        file: src/data/document-categories.yml
        fields:
          - label: Категорії
            name: categories
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Назва, name: label, widget: string }
              - { label: Опис, name: description, widget: text }
              - { label: Порядок, name: order, widget: number, value_type: int, min: 0 }
              - { label: Активна, name: active, widget: boolean, default: true }
      - name: legal-publications
        label: Нормативний реєстр
        file: src/data/legal-publications.yml
        fields:
          - label: Публікації
            name: publications
            widget: list
            required: false
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Назва, name: title, widget: string }
              - { label: Нормативне джерело, name: sourceTitle, widget: string }
              - { label: Офіційний URL, name: sourceUrl, widget: string }
              - { label: Стаття або пункт, name: sourceSection, widget: string }
              - { label: Перевірено, name: verifiedAt, widget: datetime, time_format: false }
              - { label: Хто перевірив, name: verifiedBy, widget: string }
              - {
                  label: Наступна перевірка,
                  name: reviewDueAt,
                  widget: datetime,
                  time_format: false,
                }
              - { label: Відповідальний, name: responsibleOwnerId, widget: string }
              - { label: Шлях публікації, name: publicationPath, widget: string }
              - label: Статус
                name: status
                widget: select
                options:
                  - { label: Не перевірено, value: unverified }
                  - { label: Підтверджено, value: confirmed }
                  - { label: Замінено, value: superseded }
